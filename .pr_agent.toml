# PR-Agent 配置
# 文档：https://github.com/the-pr-agent/pr-agent/blob/main/pr_agent/settings/configuration.toml
#
# 通过 OpenAI 兼容供应商调用，BaseURL 走 OPENAI_API_BASE env
# model 加 openai/ 前缀让 litellm 走 OpenAI 兼容协议

[config]
# 默认走 pytrio/grok-4.5（与聊天侧 model id 对齐）；UA 覆盖仍用于 bypass WAF
model = "openai/pytrio/grok-4.5"
fallback_models = []
custom_model_max_tokens = 128000

[litellm]
# 本代理 WAF 拦 litellm 默认带的 `OpenAI/Python ...` UA，覆盖掉
extra_headers = '{"User-Agent":"litellm/1.99.0"}'