apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: demo
  labels:
    app: orders-api
data:
  # 根因：DB_HOST 漂移指向 payments ns 的库；orders-api 本该连 demo ns 的 orders-db
  DB_HOST: "payments-db.payments.svc.cluster.local"
  # 无关健康键：exporter 只消费它（证 ConfigMap 非整体损坏，坏的是 DB_HOST 这个键的值）
  LOG_LEVEL: "info"
