name: oom-killed
kind_cluster_name: aruing-sc-oom-killed
namespace: demo
# 给人看的坏态提示；脚本不解析本文件
notes: "容器内存 limit 16Mi + tail /dev/zero 无限占内存 → 反复 OOMKilled 重启（describe 的 Last State 可见 Reason: OOMKilled）"
# 难度理论值：只存原子事实（可数），六维分数由 aruing scenarios 机械派生
# 无诱饵；闭环需 Last State 的 OOMKilled / Exit Code 137（容器状态）+ limits.memory 16Mi
# （配置）两种来源，两者需对上才能排除「业务代码崩」与「节点内存不足」；单 ns，单轮
difficulty:
  faults: 1
  evidence_sources: 2
  decoys: 0
  output_scale: plain
  capability_restricted: false
  layers: 1
  session_rounds: 1
  info_gap: false
# 场景真值四元组：判分器（aruing judge）机械判分的依据；资源名与 manifests 实名一致
ground_truth:
  resource_type: deployment
  resource_name: demo-api
  namespace: demo
  fault_type: oom-killed
  fault_signature: [OOMKilled, memory, 内存]
