apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-api
  namespace: shop
  labels:
    app: web-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 卡死形态关键参数：只加售不放旧 → v2 永不 ready 时旧代保持服务，rollout 永卡
      # （稳态 = 3×v1 Ready + 1×v2 Running 0/1，不产生服务中断类噪音）
      maxSurge: 1
      maxUnavailable: 0
  # 加速 Progressing=False/ProgressDeadlineExceeded 状态可现（spec 级，不扰动 RS 代数）；
  # 验收不依赖它（探针失败事件即时确定）
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: web-api
  template:
    metadata:
      labels:
        app: web-api
        version: v1
    spec:
      containers:
        - name: web-api
          # 健康代：busybox httpd 常驻监听 8080，/www/healthz 预置返回 200，
          # 就绪探针 /healthz:8080 通过
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "mkdir -p /www && echo ok > /www/healthz && httpd -f -p 8080 -h /www"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-api
  namespace: shop
  labels:
    app: web-api
spec:
  # 两代 pod（app=web-api）都接流量：maxUnavailable=0 下旧代持续服务，现场仿真
  selector:
    app: web-api
  ports:
    - port: 80
      targetPort: 8080
