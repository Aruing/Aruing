# 无诱饵；闭环需 容器状态（CreateContainerConfigError）+ 事件（configmap not found）
# + ConfigMap 确实不存在（配置 / 关联对象）三种来源；单 ns，单轮
difficulty:
  faults: 1
  evidence_sources: 3
  decoys: 0
  output_scale: plain
  capability_restricted: false
  layers: 1
  session_rounds: 1
  info_gap: false
# 场景真值四元组：判分器（aruing judge）机械判分的依据；资源名与 manifests 实名一致
ground_truth:
  resource_type: deployment
  resource_name: demo-api
  namespace: demo
  fault_type: missing-configmap
  fault_signature: [CreateContainerConfigError, configmap]
