apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: edge
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        # 实际标签 app=frontend——与 core 侧放行规则 from podSelector(app=frontend-web)
        # 不匹配，是根因的另一半（错值在 30-netpol-api.yaml）
        app: frontend
    spec:
      containers:
        - name: frontend
          # 症状载体（数据面模拟，系列纪律 5）：kind 默认 CNI 不 enforce
          # NetworkPolicy，崩溃症状由脚本确定性重放——真实 nc 尝试结果丢弃、
          # 恒打印超时并退出。措辞用 timeout（策略丢包语义）而非 refused
          # （未监听语义，会误导归因到「api 没起」）；拨的是 Service 端口 80
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              nc -w 2 api.core.svc.cluster.local 80 >/dev/null 2>&1 || true
              echo "dial tcp api.core.svc.cluster.local:80: i/o timeout"
              exit 1
