apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: core
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # 健康服务端：busybox httpd 监听 8080、/healthz 返回 200——
          # 「api 挂了」假设的证据面排除项（Running + ready + Service 正常）
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "mkdir -p /www && echo ok > /www/healthz && httpd -f -p 8080 -h /www"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: core
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
