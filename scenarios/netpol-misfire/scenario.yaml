name: netpol-misfire
kind_cluster_name: aruing-sc-netpol-misfire
namespace: edge
# 给人看的坏态提示；脚本不解析本文件
# 数据面模拟声明（系列纪律 5，D 专属）：kind 默认 CNI 不 enforce NetworkPolicy，
# frontend 崩溃症状由容器脚本确定性重放（真实 nc 结果丢弃、恒打印超时并退出）；
# NetworkPolicy 对象与标签错配真实存在；验收/判分不要求连通性实测类证据
#（工具面白名单 get/describe/logs/events 本也无此能力），同 bigtable-fleet 先例。
# 诱饵清单：sandbox ns deny-all（Ingress/Egress 全拒，凶相最足，但作用域仅
# sandbox pod——edge→core 流量不归它管，ns 内无工作负载）。
# signature 唯一性：frontend-web/不匹配/拼错/写错/mismatch/typo 只属于根因讨论
#（allow-frontend-to-api 的 from podSelector 错值与错配结论）；类型词
#（networkpolicy/netpol/网络策略/ingress）被同型诱饵污染不进 signature——
# 停在 deny-all 的结论必 miss（判分锚设计见步骤 plan 决策 4）
notes: "症状：edge ns frontend×2 CrashLoop（日志 dial tcp api.core.svc.cluster.local:80: i/o timeout）。根因：core ns NetworkPolicy allow-frontend-to-api 的 ingress from podSelector 标签 frontend-web 与 frontend 实际标签 app=frontend 不匹配 → 规则匹配空集 → api 入站对所有人关闭。诱饵：sandbox 的 deny-all，作用域管不着。数据面模拟：kind 不 enforce netpol，症状由脚本重放。"
# 场景真值四元组：判分器（aruing judge）机械判分的依据；资源名与 manifests 实名一致
ground_truth:
  resource_type: networkpolicy
  resource_name: allow-frontend-to-api
  namespace: core
  fault_type: ingress-selector-label-mismatch
  fault_signature: [frontend-web, 不匹配, 拼错, 写错, mismatch, typo]
