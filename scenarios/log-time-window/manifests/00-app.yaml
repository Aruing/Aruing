apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: demo
  labels:
    app: demo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      containers:
        - name: demo-api
          # busybox 每 2s 打一行启动日志，共 4 行后 exit 1 → CrashLoopBackOff → 重启周期累积
          # kubectl logs --timestamps 会在每行前加 RFC3339 前缀，即时间游标的过滤载体
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=1
              while [ "$i" -le 4 ]; do
                echo "tick $i: demo-api booting phase-a"
                sleep 2
                i=$((i + 1))
              done
              echo "fatal: demo-api crashed on purpose; exiting"
              exit 1
