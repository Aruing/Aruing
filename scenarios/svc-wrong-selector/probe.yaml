# 探针实验规格（0.1.3 步骤 4）：svc-wrong-selector 场景的长会话脚本素材
# 口径同 crashloop-bad-image/probe.yaml（头部注释见彼处）
name: svc-wrong-selector
diagnose_request: "请正式诊断 demo namespace 下的 demo-web 服务：访问不通，排查根因并给出报告。"
qa_pool:
  - "demo namespace 里现在有哪些 Service？"
  - "帮我看一眼 demo-web 后面的 Pod 健康状况。"
  - "集群里最近有没有网络相关的异常？"
  - "顺便说说 Service 和 Endpoints 的关系。"
  - "demo namespace 的资源配额用得怎么样？"
probes:
  # 证据回灌类：考第 2 次诊断关注的资源实体（pod/endpoint 名带后缀，账本展开）
  - id: pod-of-run2
    class: evidence
    question: "第 2 次诊断里你重点查了哪个资源实体？"
    expect:
      - from_ledger: { rule: kth_run_pods, k: 2 }
  # 证据链细节类：考第 2 次诊断实际执行过的命令
  - id: cmd-of-run2
    class: chain
    question: "第 2 次诊断时你跑了什么命令确认 Endpoints 的状态？"
    expect:
      - from_ledger: { rule: kth_run_commands, k: 2 }
  # 跨压缩综合类：对比首末诊断结论，须同时命中两次诊断实体与服务名
  - id: first-vs-last
    class: synthesis
    question: "对比第一次和最后一次 demo-web 诊断的结论，结论一致吗？"
    expect:
      - from_ledger: { rule: kth_run_pods, k: 1 }
      - from_ledger: { rule: kth_run_pods, k: -1 }
      - literal: "demo-web"
