difficulty:
  faults: 1
  evidence_sources: 2
  decoys: 0
  output_scale: plain
  capability_restricted: false
  layers: 1
  session_rounds: 1
  info_gap: false
# 场景真值四元组：判分器（aruing judge）机械判分的依据；资源名与 manifests 实名一致
ground_truth:
  resource_type: service
  resource_name: demo-web
  namespace: demo
  fault_type: selector-mismatch
  fault_signature: [demo-web-typo, selector, 选择器]
