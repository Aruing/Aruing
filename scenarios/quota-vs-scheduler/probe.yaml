# 探针实验规格（0.1.5 hard-scenarios）：quota-vs-scheduler 场景的长会话脚本素材
# 由 aruing probe 消费（scenario.yaml 同目录）；run/judge 主路径不读本文件
# 口径同 crashloop-bad-image/probe.yaml（头部注释见彼处）
name: quota-vs-scheduler
diagnose_request: "请正式诊断 billing namespace 下的 payment-svc：新部署后副本数一直是 0，一个 Pod 都没创建出来，排查根因并给出报告。"
qa_pool:
  - "billing namespace 里现在跑着哪些工作负载？"
  - "payment-svc 现在是什么状态？"
  - "billing namespace 的资源配额用了多少？"
  - "集群里的节点都有哪些标签？"
  - "billing namespace 最近有哪些事件？"
probes:
  # 证据回灌类：考第 3 次诊断查出的正在运行的 pod 名（ledger-api pod，带随机后缀，账本展开）
  - id: pod-of-run3
    class: evidence
    question: "第 3 次诊断查出的正在运行的 pod 叫什么名字？"
    expect:
      - from_ledger: { rule: kth_run_pods, k: 3 }
  # 证据链细节类：考最后一次诊断实际执行过的命令
  - id: cmd-of-last
    class: chain
    question: "最后一次诊断时你跑了什么命令拿到关键证据？"
    expect:
      - from_ledger: { rule: kth_run_commands, k: -1 }
  # 跨压缩综合类：对比首末诊断结论，须同时命中两次诊断的 pod 名与资源名
  - id: first-vs-last
    class: synthesis
    question: "对比第一次和最后一次 payment-svc 起不来的诊断结论，一致吗？"
    expect:
      - from_ledger: { rule: kth_run_pods, k: 1 }
      - from_ledger: { rule: kth_run_pods, k: -1 }
      - literal: "payment-svc"
