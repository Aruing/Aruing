# Aruing process config (YAML).
# Copy to aruing.yaml or playground/config.yaml and fill LLM fields.
# Priority: CLI (--verbose) > env (ARUING_*) > this file > zero values.
#
# Do not commit real api_key. Prefer env for secrets in shared/CI setups.

llm:
  # OpenAI-compatible base URL (include /v1 if required by the endpoint)
  base_url: https://your-openai-compatible-endpoint/v1
  # Access token; local endpoints that require a placeholder may use any non-empty string
  api_key: ""
  # Model name as required by the provider
  model: ""

tools:
  # Absolute path to kubectl; empty = look up "kubectl" on PATH
  kubectl_path: ""
  # Allow in-pod diagnostic probes (ping/nslookup). Default false (read-only policy).
  allow_diagnostic_exec: false
  # Max kubectl stdout bytes kept in evidence/raw before truncate; 0 = k8s default 1MiB.
  # Env: ARUING_K8S_MAX_STDOUT_BYTES
  max_stdout_bytes: 0
  # Table projection method for method-comparison experiments; empty = fast (default
  # three-segment path). Values: fast | greedy | greedy-knapsack | full | head-tail |
  # uniform. Unknown values fail at startup. Env: ARUING_TOOLS_PROJECTION_METHOD
  projection:
    method: ""
    # Row budget in runes for greedy/head-tail/uniform; 0 = default 4096
    budget: 0
    # Lambda weight of the anomaly term (greedy only); 0 = default 1
    lambda: 0
    # Uniform coverage weights (ablation); default rarity-weighted (log2)
    uniform_weight: false

# Orchestrator-side switches (experiment arms must be configured explicitly).
# Memory assembly for `aruing chat` history injection:
#   ours (default) | d1-last-n | d2-flat-summary (pure baselines for memory
#   experiments: no index cards, no rehydration; d1 keeps only the last N
#   messages). Unknown values fail at startup.
# Env: ARUING_AGENT_MEMORY_METHOD / ARUING_AGENT_MEMORY_LAST_N
agent:
  memory:
    method: ""
    # D1 window size in messages; 0 = default 20
    last_n: 0

# Terminal UI for `aruing chat`: theme dark | light | auto (auto detects terminal
# background), mode inline | app (inline = scrollback-style chat, app = fullscreen).
# Env: ARUING_TUI_THEME / ARUING_TUI_MODE; CLI: --ui inline|app overrides mode.
tui:
  theme: auto
  mode: inline

# Print Tower / orchestrator progress to stderr (same as ARUING_DEBUG=1 / --verbose)
debug: false
