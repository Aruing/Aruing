# TUI 主题覆盖示例 —— 复制到任意路径，然后在 aruing 配置中写明：
#
#   tui:
#     theme_file: <该文件路径>
#
# 语义：写明才加载；文件里只覆盖你声明的样式项，其余回落内置基底（dark/light）。
# base 不写则取 tui.theme 的归一结果（dark/light/auto → dark 或 light）。
#
# 角色名（styles 的键，只允许这些；写错启动会报错）：
#   user      你输入的内容
#   assistant aruing 的回复正文
#   err       错误提示
#   system    系统提示（banner 等）
#   spinner   思考中动画
#   prompt    输入提示符（❯）
#   divider   轮与轮之间的分隔线
#
# 颜色格式：ANSI 256 编号（如 "205"）或 hex（如 "#ff005f"）。
# padding / margin：四个数 [上, 右, 下, 左]，单位为行/格，非负。
#   margin 是块间距（消息块上下空行数），显式写 0 也生效（0 就是 0）：
#   - user.margin-top                = 你输入上方空行数（默认 1）
#   - assistant.margin-top/bottom    = 输入与回复（含思考中动画）之间 / 回复块下方空行数（默认 1 / 0）
#   - divider.margin-top/bottom      = 轮间分隔线上 / 下空行数（默认 1 / 0）
#   左右两值当前无消费点，填 0。仅 user / assistant / divider 支持 margin，
#   其他角色写 margin 启动会报错（防误解后静默无效）。
#
# labels（称呼开关，顶层键，默认关）：
#   默认消息直接呈现内容、无称呼前缀；开启后每条消息先单独一行称呼
#   （user / assistant 样式渲染），再换行放内容。文案不写则默认 你 / aruing。

base: dark

# labels:
#   enabled: true
#   user: "你"
#   assistant: "aruing"

styles:
  user:
    foreground: "#00aaff"   # 你的输入颜色（默认 dark: 39）
    bold: true
    margin: [1, 0, 0, 0]    # 输入行上方留 1 行空隙

  assistant:
    foreground: "252"        # 回复正文颜色（默认 dark: 252）
    margin: [1, 0, 0, 0]    # 输入与回复之间留 1 行空隙（动画与回复共用）

  err:
    foreground: "#ff5f5f"
    bold: true

  system:
    foreground: "245"

  spinner:
    foreground: "212"

  prompt:
    foreground: "#00aaff"
    bold: true

  divider:
    foreground: "240"        # 分隔线颜色
    margin: [1, 0, 0, 0]     # 分隔线上方留 1 行空行（下方默认 0，与下轮输入的空行由 user.margin-top 提供）

  # 边框示例（当前 UI 尚未启用边框；声明后供未来组件消费，不会破坏现有渲染）：
  # assistant:
  #   border:
  #     color: "240"
  #     rounded: true
  #   padding: [0, 1, 0, 1]
