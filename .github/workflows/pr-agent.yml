name: PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr_agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run PR Agent
        uses: the-pr-agent/pr-agent@v0.39.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # DeepSeek 官方 API：LiteLLM 原生 deepseek provider，自带 base URL 与上下文窗口，无需 openai-compat 兜底
          # 代码审核是推理密集任务，用 pro 档；flash 档作降级备份（pro 限流/不可用时兜底）
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CONFIG__MODEL: deepseek/deepseek-v4-pro
          CONFIG__FALLBACK_MODELS: '["deepseek/deepseek-v4-flash"]'

          # 默认 pr-agent 在 synchronize 事件不跑命令，这里打开
          GITHUB_APP__HANDLE_PUSH_TRIGGER: "true"
