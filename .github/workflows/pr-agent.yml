name: PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr_agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run PR Agent
        uses: the-pr-agent/pr-agent@v0.39.0
        env:
          # 凭据
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # OpenAI 兼容供应商：双下划线映射 [openai] section（pr-agent 的 Dynaconf envvar_prefix=False）
          OPENAI__API_BASE: https://newapi.pytrio.asia/v1

          # 配置覆盖：env var 优先级最高，与 .pr_agent.toml 保持一致
          CONFIG__MODEL: openai/glm-5.2
          CONFIG__FALLBACK_MODELS: '[]'
          # 自定义模型不在 pr-agent 内置 MAX_TOKENS 表，显式声明
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: '128000'

          # 默认 pr-agent 在 synchronize 事件不跑命令，这里打开
          GITHUB_APP__HANDLE_PUSH_TRIGGER: 'true'

          # 本代理 WAF 拦 litellm 默认带的 `OpenAI/Python ...` UA，用 extra_headers 覆盖
          LITELLM__EXTRA_HEADERS: '{"User-Agent":"litellm/1.99.0"}'