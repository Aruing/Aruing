name: PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr_agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Debug curl proxy from runner
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          set -x
          curl -sS -X POST https://newapi.pytrio.asia/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"gemini-3-pro-preview","messages":[{"role":"user","content":"say hi"}],"max_tokens":16}'
          echo
          echo "--- second try with bigger body ---"
          curl -sS -X POST https://newapi.pytrio.asia/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"gemini-3-pro-preview","temperature":0,"response_format":{"type":"json_object"},"messages":[{"role":"system","content":"You are PR-Reviewer."},{"role":"user","content":"Review: +name: PR Agent"}],"max_tokens":64}'
          echo
      - name: Run PR Agent
        uses: the-pr-agent/pr-agent@v0.39.0
        env:
          # 凭据
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # OpenAI 兼容供应商：双下划线映射 [openai] section（pr-agent 的 Dynaconf envvar_prefix=False）
          OPENAI__API_BASE: https://newapi.pytrio.asia/v1

          # 配置覆盖：env var 优先级最高，仅在 .pr_agent.toml 尚未合到 main 前兜底
          # 经验证：本代理的 OpenAI 系上游异常、DeepSeek/Kimi/Qwen/GLM/MiniMax/Mimo 配额耗尽
          # gemini-3-pro-preview 在我本地 curl 可用但从 GitHub Actions 出站 IP 被 WAF 拦
          # grok-4.5-high 实测可用且 xAI 上游不拦 GH IP，故选它（reasoning 模型）
          CONFIG__MODEL: openai/grok-4.5-high
          CONFIG__FALLBACK_MODELS: '[]'
          # grok-4.5-high 不在 pr-agent 内置 MAX_TOKENS 表，显式声明
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: '128000'

          # 默认 pr-agent 在 synchronize 事件不跑命令，这里打开
          GITHUB_APP__HANDLE_PUSH_TRIGGER: 'true'