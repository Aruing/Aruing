name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Check module files
        run: make tidy-check
      - name: Build CLI
        run: make build
      - name: Run tests
        run: make test-ci

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: make fmt-check
      - name: Run go vet
        run: make vet
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # 最新预编译包(v2.12.2)用 go1.25 构建，无法 lint go 1.26 模块
          # 改为从源码用 setup-go 安装的 go 1.26 构建，规避工具链版本滞后
          install-mode: goinstall
          version: v2.12.2

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Scan for reachable vulnerabilities
        run: make vuln
